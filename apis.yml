name: Visby Medical
description: >-
  Visby Medical is a molecular diagnostics company that has miniaturized the
  gold-standard PCR laboratory onto a single-use, palm-sized point-of-care
  device, delivering lab-quality results in about 30 minutes without any
  instrument, sample transport, or lab infrastructure. Its consumer offering
  (sold direct at visby.com) is an FDA-authorized at-home women's sexual health
  test that detects Chlamydia, Gonorrhea, and Trichomoniasis, paired with
  same-day telehealth consultation on a positive result. Visby also builds
  point-of-care PCR platforms for clinical and respiratory pathogen testing.
  The company is backed by venture investors including Amplify Partners. This
  API Evangelist profile tracks Visby Medical as a company; the business is a
  hardware diagnostics and direct-to-consumer commerce operation and does not
  publish a first-party developer API, SDK, or developer portal at this time.
